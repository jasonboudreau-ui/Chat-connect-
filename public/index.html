<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CRM Chat</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Sign in: through the company's own system. Nobody signs up here, and no password is kept. -->
  <main id="signin" class="signin" hidden>
    <div class="orbit">
      <div class="mark" aria-hidden="true"><span>◆</span></div>
      <h1 class="wordmark">CRM Chat</h1>
      <p id="signin-error" class="signin-error" role="alert" hidden></p>
      <div id="signin-buttons" class="signin-buttons"></div>
      <form id="password-form" class="password-form" hidden>
        <input id="password-email" type="email" placeholder="Email" autocomplete="username" aria-label="Email" required />
        <div class="password-row">
          <input id="password-password" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" required />
          <button type="submit" id="password-submit" aria-label="Log in">→</button>
        </div>
        <button type="button" id="password-back" class="ghost">Back</button>
      </form>
      <p id="signin-none" class="signin-foot" hidden>No sign-in is set up yet.</p>
      <div id="demo-people" class="demo" hidden>
        <button type="button" id="demo-toggle" class="ghost">Try the demo</button>
        <div id="demo-list" class="demo-list" hidden></div>
      </div>
    </div>
  </main>

  <div id="app" class="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand"><span class="logo">◆</span> CRM Chat</div>
        <span id="company" class="muted small"></span>
      </div>
      <input id="people-search" class="search" type="search" placeholder="Find a person or channel" />
      <nav>
        <div class="section"><span>Channels</span><button id="new-channel" class="icon-btn small" title="New channel">＋</button></div>
        <ul id="channels"></ul>
        <div class="section" id="teams-head"><span>Teams</span><span class="hint" title="Created from your company's teams">auto</span></div>
        <ul id="teams"></ul>
        <div class="section"><span>People</span></div>
        <ul id="people"></ul>
      </nav>
      <div class="me" id="me"></div>
    </aside>

    <section class="main">
      <header class="channel-head">
        <button id="toggle-sidebar" class="icon-btn mobile-only" title="Menu">☰</button>
        <div>
          <h2 id="channel-title"></h2>
          <div id="channel-sub" class="muted small"></div>
        </div>
      </header>
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="composer" class="composer">
        <textarea id="composer-text" rows="1" placeholder="Message" maxlength="4000"></textarea>
        <button type="submit">Send</button>
      </form>
    </section>

    <aside class="profile" id="profile" hidden></aside>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
